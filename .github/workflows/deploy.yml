name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Validate dữ liệu
        run: npm run validate

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Đặt biến repo BASE_PATH=/xomcoding-devtools/ nếu deploy ở subpath
          # (chưa có custom domain). Với tools.xomcoding.me giữ mặc định "/".
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
